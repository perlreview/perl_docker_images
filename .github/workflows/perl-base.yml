---
name: perl-base

permissions:
    contents: read
    packages: write

on:
    push:
        paths:
            - .github/workflows/perl-base.yml
            - layers/perl-base/build-perl-base-images.pl
            - layers/perl-base/Dockerfile
    workflow_dispatch:
    workflow_run:
        types:
            - completed
        workflows:
            - base

jobs:
    x86-amd64:
        environment: ghcr
        runs-on: ubuntu-latest
        steps:
            # https://github.com/docker/login-action
            - id: login
              name: Login to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
            # https://github.com/docker/setup-qemu-action
            - id: setup-buildx
              name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - uses: actions/checkout@v3
            - id: build-perl-modules
              name: Build modules
              run: |
                perl layers/perl-base/build-perl-base-images.pl
