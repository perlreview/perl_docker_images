---
name: build-modules-images

permissions:
    contents: read
    packages: write

on:
    push:
        paths:
            - .github/workflows/modules.yml
            - layers/modules-base/build-modules-base-images.pl
            - layers/modules-base/Dockerfile
    workflow_dispatch:
    workflow_run:
        types:
            - completed
        workflows:
            - perl-base

jobs:
    x86-amd64:
        environment: ghcr
        runs-on: ubuntu-latest
        strategy:
            matrix:
                versions:
                    - 5.8.9
                    - 5.10.1
                    - 5.12.5
                    - 5.14.4
                    - 5.16.3
                    - 5.18.4
                    - 5.20.3
                    - 5.22.4
                    - 5.24.4
                    - 5.26.3
                    - 5.28.3
                    - 5.30.3
                    - 5.32.1
                    - 5.34.3
                    - 5.36.3
                    - 5.38.5
                    - 5.40.3
                    - 5.42.0
                platforms:
                    - linux/amd64
        steps:
            # https://github.com/docker/login-action
            - id: login
              name: Login to GHCR
              uses: docker/login-action@v4
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
            # https://github.com/docker/setup-qemu-action
            - id: setup-buildx
              name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - uses: actions/checkout@v7
            - id: build-perl-modules
              name: Build modules
              run: |
                perl layers/modules-base/build-modules-base-images.pl ${{matrix.platforms}} ${{matrix.versions}}
