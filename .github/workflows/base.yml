---
name: base

permissions:
    contents: read
    packages: write

on:
    push:
        paths:
            - .github/workflows/base.yml
            - layers/base/build.sh
            - layers/base/Dockerfile
    workflow_dispatch:

jobs:
    x86-amd64:
        environment: ghcr
        runs-on: ubuntu-latest
        steps:
            - id: login
              name: Login to GHCR
              uses: docker/login-action@v3
              with:
                registry: ghcr.io
                username: ${{ github.actor }}
                password: ${{ secrets.PACKAGES_ADMIN_TOKEN }}
            - id: setup-buildx
              name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3
            - uses: actions/checkout@v3
            - id: build-base
              name: Build base image
              run: |
                cd layers/base
                ./build.sh
